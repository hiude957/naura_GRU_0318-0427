# A100 80G config focused on continuous sensor behavior after actions.
run_name: gru_full_sensor_replicate64_action60s_h256
run_root: runs
data:
  cache_dir: outputs/cache/fixed_110ms_v1
  train_stride: 128
  val_stride: 256
  skip_empty_target_windows: true
model:
  type: gru
  input_size: 551
  output_size: 150
  hidden_size: 256
  num_layers: 2
  dropout: 0.1
  head_layer_norm: true
target:
  mode: full_sensor
  continuous_loss_weight: 1.0
  binary_loss_weight: 1.0
  continuous_action_weight:
    enabled: true
    window_ms: 60000
    weight: 5.0
  continuous_change_weight:
    enabled: true
    active_threshold: 0.01
    change_loss_weight: 3.0
    change_threshold: 0.005
    max_loss_weight: 8.0
  binary_sensor_indices_1based:
    - 22
    - 93
    - 94
    - 95
    - 96
    - 97
    - 98
    - 99
    - 100
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 107
    - 108
    - 109
    - 110
    - 111
    - 112
    - 113
    - 114
    - 115
    - 116
    - 117
    - 118
    - 119
    - 120
    - 121
    - 122
    - 123
    - 124
    - 125
    - 126
    - 127
    - 128
    - 146
    - 147
    - 148
train:
  seq_len: 256
  batch_size: 128
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  precision: bf16
  gradient_clip: 1.0
  num_workers: 8
  pin_memory: true
  seed: 20260511
metrics:
  near_zero_threshold: 0.005
  relative_error_threshold: 0.20
checkpoint:
  save_best: true
  save_best_accuracy: true
  save_last: true
  monitor: val_loss
stages:
  - name: rollout_only_action60s
    mode: rollout_only
    context_len: 256
    rollout_steps: 64
    batch_size: 128
    val_batch_size: 256
    epochs: 15
    lr: 0.0001
    weight_decay: 0.0001
    gradient_clip: 1.0
    precision: bf16
    progress: false
