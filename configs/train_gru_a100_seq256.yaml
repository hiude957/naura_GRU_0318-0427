# A100 80G seq_len=256 ablation config.
run_name: gru_full_sensor_seq256_rollout
run_root: runs
data:
  cache_dir: outputs/cache/fixed_110ms_v1
  train_stride: 128
  val_stride: 256
  skip_empty_target_windows: true
model:
  type: gru
  input_size: 551
  output_size: 150
  hidden_size: 512
  num_layers: 2
  dropout: 0.1
target:
  mode: full_sensor
  continuous_loss_weight: 1.0
  binary_loss_weight: 1.0
  binary_sensor_indices_1based:
    - 22
    - 93
    - 94
    - 95
    - 96
    - 97
    - 98
    - 99
    - 100
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 107
    - 108
    - 109
    - 110
    - 111
    - 112
    - 113
    - 114
    - 115
    - 116
    - 117
    - 118
    - 119
    - 120
    - 121
    - 122
    - 123
    - 124
    - 125
    - 126
    - 127
    - 128
    - 146
    - 147
    - 148
train:
  seq_len: 256
  batch_size: 512
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  precision: bf16
  gradient_clip: 1.0
  num_workers: 8
  pin_memory: true
  seed: 20260511
metrics:
  near_zero_threshold: 0.005
  relative_error_threshold: 0.20
checkpoint:
  save_best: true
  save_last: true
  monitor: val_loss
stages:
  - name: stage1_teacher_forcing
    mode: teacher_forcing
    seq_len: 256
    batch_size: 512
    epochs: 50
    lr: 0.001
  - name: stage2_rollout_finetune
    mode: rollout
    init_from: stage1_best
    context_len: 256
    rollout_steps: 128
    rollout_loss_weight: 0.2
    batch_size: 128
    epochs: 20
    lr: 0.0003
